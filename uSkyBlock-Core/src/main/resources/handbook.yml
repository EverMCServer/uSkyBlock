# =============================================================================
# 海岛手册（示例文件）
# =============================================================================
# 这是装好插件后自动释放的模板，用来演示 handbook.yml 的写法。
# 正式内容请直接改 plugins/uSkyBlock/handbook.yml（本仓库的 uSkyBlock/ 目录），
# 改完用 /handbook reload 重新读取，不用重启服务器。
#
# 一页书的真实容量：14 行，每行约 12 个汉字（= 114 像素）。
# 长句不用手动断行：渲染时按显示宽度自动折行，超过 14 行会自动续页。
#
# 可用标记
#   &0-&f 颜色 / &l 粗 / &o 斜 / &n 下划线 / &m 删除线 / &k 乱码 / &r 重置
#   [[文字|章节id]]      跳到该章节
#   [[文字|3]]           跳到第 3 页
#   [[文字|cmd:/is home]] 点击执行命令
#   [[文字|url:https://example.com]] 点击打开网址
#   {{章节id}}           该章节的页码（写目录用）
#   %page% / %total%     当前页码 / 总页数
# =============================================================================

default-book: handbook

options:
  lines-per-page: 14
  line-width: 114

books:
  handbook:
    title: 海岛手册
    author: 服务器
    pages:
      - id: cover
        text: |
          &8&m----------
          &6&l海岛手册
          &7示例模板
          &8&m----------

          &f把这几页换成你自己
          &f的内容即可。

          &e[[目录|toc]]
      - id: toc
        text: |
          &6&l目录
          &8----------
          &7[[从零开始|start]] &8{{start}}
          &7[[跳回封面|cover]] &8{{cover}}

          &7共 %total% 页
      - id: start
        text: |
          &6&l从零开始
          &8----------
          &f把这里写成真正的手
          &f册内容。

          &7[[打开岛屿菜单|cmd:/is]]
          &7[[回到封面|cover]]
